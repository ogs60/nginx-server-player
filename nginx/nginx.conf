worker_processes auto;
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 识别 App 与移动客户端（放行手机端与App，拦截电脑网页端与机器扫描）
    map $http_user_agent $is_app_ua {
        default 0;
        "~*Android" 1;
        "~*Mobile" 1;
        "~*iPhone" 1;
        "~*WebIntoApp" 1;
        "~*BearMusicApp" 1;
    }

    upstream music_player {
        zone music_player 64k;
        server nginx-server:80 resolve;
        keepalive 32;
    }

    upstream oauth2_proxy {
        zone oauth2_proxy 64k;
        server oauth2-proxy:4180 resolve;
    }


    server {
        listen 80;
        listen [::]:80;
        server_name mc.azhuan.ren;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name mc.azhuan.ren;

        ssl_certificate     /etc/nginx/certs/fullchain.cer;
        ssl_certificate_key /etc/nginx/certs/mc.azhuan.ren.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
     
        location /oauth2/ {
              proxy_pass http://oauth2_proxy;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Scheme https;
              proxy_set_header X-Auth-Request-Redirect $request_uri;
          }

          location = /oauth2/auth {
              if ($is_app_ua = 1) {
                  return 200;
              }
              if ($arg_app = "1") {
                  return 200;
              }
              proxy_pass http://oauth2_proxy/oauth2/auth;
              proxy_pass_request_body off;
              proxy_set_header Content-Length "";
              proxy_set_header X-Original-URI $request_uri;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto https;
          }

          location = /manifest.json {
              proxy_pass http://music_player;
              proxy_set_header Host $host;
          }

          location = /logo.svg {
              proxy_pass http://music_player;
              proxy_set_header Host $host;
          }

          location /s/ {
              proxy_pass http://music_player;
              proxy_http_version 1.1;
              proxy_set_header Connection "";

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;

              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_buffering off;
          }

          location @oauth2_signin {
              return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
          }

          location / {
              auth_request /oauth2/auth;
              error_page 401 = @oauth2_signin;

              auth_request_set $user  $upstream_http_x_auth_request_user;
              auth_request_set $email $upstream_http_x_auth_request_email;
              auth_request_set $groups $upstream_http_x_auth_request_groups;

              proxy_set_header X-Auth-Request-User $user;
              proxy_set_header X-Auth-Request-Email $email;
              proxy_set_header X-Auth-Request-Groups $groups;

              proxy_pass http://music_player;
              proxy_http_version 1.1;
              proxy_set_header Connection "";

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;

              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_buffering off;
          }
      }
  }
