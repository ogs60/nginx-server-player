name: Build and Push Docker Image

 on:
   push:
     branches:
       - main

 jobs:
   build:
     runs-on: ubuntu-latest

     permissions:
       contents: read
       packages: write

     steps:
       - name: Checkout
         uses: actions/checkout@v6

       - name: Set up Buildx
         uses: docker/setup-buildx-action@v4

       - name: Login to GHCR
         uses: docker/login-action@v4
         with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Build and push
         uses: docker/build-push-action@v7
         with:
           context: .
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/nginx-server-player:latest
